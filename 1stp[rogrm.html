<!DOCTYPE html>
<html>
<head>
    <title>મારું પ્રોફાઇલ પેજ</title>
</head>
<body>

    <!-- મુખ્ય હેડિંગ -->
    <h1>નમસ્તે, મારું નામ રાહુલ છે!</h1>
    
    <!-- પેરેગ્રાફ -->
    <p>હું અત્યારે HTML અને વેબ ડિઝાઇન્સ શીખી રહ્યો છું. આ મારો એક પ્રેક્ટિસ પ્રોગ્રામ છે.</p>

    <hr> <!-- આડી લીટી (Horizontal Line) -->

    <!-- મારી શાનદાર સ્કિલ્સ (સૂચિ/List) -->
    <h2>હું શું શીખી રહ્યો છું?</h2>
    <ul>
        <li>HTML5 (વેબ પેજનું માળખું)</li>
        <li>CSS (વેબ પેજની ડિઝાઇન)</li>
        <li>JavaScript (વેબ પેજને ટાસ્ક આપવા)</li>
    </ul>

    <!-- લિંક ઉમેરવી -->
    <h2>મહત્વપૂર્ણ લિંક્સ:</h2>
    <p>વધુ માહિતી માટે <a href="https://www.google.com" target="_blank">Google પર સર્ચ કરો</a>.</p>

    <!-- એક સાદું બટન -->
    <button onclick="alert('તમે બટન પર ક્લિક કર્યું!')">અહીં ક્લિક કરો</button>

</body>
</html>
